<!DOCTYPE html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的藏書閣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              dark: {
                900: "#1a1b1e",
                800: "#25262b",
                700: "#2c2e33",
                600: "#373a40",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #1a1b1e;
        color: #c1c2c5;
        font-family: "Segoe UI", Microsoft JhengHei, sans-serif;
      }
      /* 自定義捲軸 */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1b1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #373a40;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4dabf7;
      }
      .modal-enter-active,
      .modal-leave-active {
        transition: opacity 0.3s ease;
      }
      .modal-enter-from,
      .modal-leave-to {
        opacity: 0;
      }

      /* ★★★ 新增：狀態條動畫 ★★★ */
      .toast-enter-active,
      .toast-leave-active {
        transition: all 0.3s ease;
      }
      .toast-enter-from,
      .toast-leave-to {
        opacity: 0;
        transform: translateY(20px);
      }

      /* ★★★ 新增：拖曳物理效果優化 ★★★ */
      /* 1. 卡片被拿起來時的樣式 (稍微傾斜 + 放大 + 陰影) */
      .sortable-drag {
        opacity: 1 !important;
        background: #25262b;
        cursor: grabbing;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5),
          0 10px 10px -5px rgba(0, 0, 0, 0.4);
        transform: scale(1.02) rotate(2deg);
        z-index: 9999;

        /* ★★★ 新增：禁止在拖曳時選取卡片內的文字 ★★★ */
        user-select: none;
        -webkit-user-select: none; /* 支援 Safari */
      }

      /* 2. 原本位置留下的殘影樣式 */
      .sortable-ghost {
        opacity: 0.2;
        background: #2c2e33;
        border: 2px dashed #4dabf7;
      }
      /* 3. 手把樣式 */
      .drag-handle {
        cursor: grab;

        /* ★★★ 新增：手把本身也禁止選取，避免變藍色 ★★★ */
        user-select: none;
        -webkit-user-select: none;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen pb-20 relative">
      <transition name="toast">
        <div
          v-if="isLoading || isSaving"
          class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3 rounded-lg shadow-2xl border border-dark-600 bg-dark-800 text-white"
        >
          <div v-if="isLoading" class="flex items-center text-teal-400">
            <i class="fa-solid fa-circle-notch fa-spin mr-2 text-xl"></i>
            <span class="font-bold tracking-wide">讀取資料中...</span>
          </div>
          <div v-if="isSaving" class="flex items-center text-green-400">
            <i class="fa-solid fa-cloud-arrow-up fa-fade mr-2 text-xl"></i>
            <span class="font-bold tracking-wide">儲存順序中...</span>
          </div>
        </div>
      </transition>

      <nav
        class="bg-dark-800 border-b border-dark-600 sticky top-0 z-40 shadow-lg"
      >
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-book-bookmark text-teal-400 text-2xl"></i>
              <div>
                <h1 class="text-xl font-bold text-gray-100">我的藏書閣</h1>
                <div class="flex items-center text-xs gap-2">
                  <span v-if="isLoading" class="text-teal-400"
                    ><i class="fa-solid fa-circle-notch fa-spin"></i>
                    同步中...</span
                  >
                  <span v-else class="text-gray-500"
                    >共 {{ items.length }} 本收藏</span
                  >
                </div>
              </div>
            </div>
            <button
              @click="openModal()"
              class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md shadow-teal-900/50 flex items-center"
            >
              <i class="fa-solid fa-plus mr-2"></i> 新增書籍
            </button>
          </div>
        </div>
      </nav>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="flex flex-col md:flex-row gap-4 mb-6">
          <div class="relative flex-grow">
            <i
              class="fa-solid fa-search absolute left-3 top-3 text-gray-500"
            ></i>
            <input
              v-model="searchQuery"
              type="text"
              placeholder="搜尋書名、作者或出版社..."
              class="w-full bg-dark-800 border border-dark-600 text-gray-200 pl-10 pr-4 py-2.5 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none transition"
            />
          </div>
          <select
            v-model="filterStatus"
            class="bg-dark-800 border border-dark-600 text-gray-200 px-4 py-2 rounded-xl outline-none focus:ring-2 focus:ring-teal-500"
          >
            <option value="ALL">全部狀況</option>
            <option value="已購買">已購買</option>
            <option value="未購買">未購買</option>
          </select>
        </div>

        <div
          v-if="isFiltering"
          class="mb-4 text-center text-sm text-yellow-500 bg-yellow-900/20 py-2 rounded-lg border border-yellow-900/50"
        >
          <i class="fa-solid fa-info-circle"></i>
          搜尋或篩選模式下無法排序，請切換回「全部」來使用拖曳手把。
        </div>

        <div
          ref="bookListRef"
          :key="componentKey"
          v-if="filteredItems.length > 0"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"
        >
          <div
            v-for="book in filteredItems"
            :key="book.id"
            class="bg-dark-800 rounded-xl border border-dark-700 p-5 hover:border-teal-500/50 transition-all duration-300 shadow-lg relative group"
          >
            <div
              v-if="!isFiltering"
              class="drag-handle select-none absolute top-3 right-3 text-dark-600 hover:text-teal-400 p-2 z-20 transition-colors"
              title="按住這裡拖曳排序"
            >
              <i class="fa-solid fa-grip-vertical text-lg"></i>
            </div>

            <div
              v-if="book.isFinished === 'Y'"
              class="absolute -top-2 -right-2 bg-purple-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md z-10 transform rotate-12"
            >
              FIN.
            </div>

            <div class="flex justify-between items-start mb-3 pr-8">
              <h3 class="text-lg font-bold text-white leading-tight">
                {{ book.title }}
              </h3>
            </div>

            <div class="flex items-center mb-3">
              <span
                :class="book.status === '已購買' ? 'bg-teal-500/20 text-teal-300 border-teal-500/30' : 'bg-red-500/20 text-red-300 border-red-500/30'"
                class="px-2 py-1 rounded-md text-xs font-medium border whitespace-nowrap"
              >
                {{ book.status }}
              </span>
            </div>

            <div class="space-y-2 text-sm text-gray-400">
              <div class="flex items-center gap-2">
                <i
                  class="fa-solid fa-user-pen w-4 text-center text-gray-500"
                ></i>
                <span class="text-gray-300">{{ book.author }}</span>
              </div>
              <div class="flex items-center gap-2">
                <i
                  class="fa-solid fa-building w-4 text-center text-gray-500"
                ></i>
                <span>{{ book.publisher }}</span>
                <span class="text-gray-600">|</span>
                <span>{{ book.pubDate }}</span>
              </div>
              <div class="flex items-center gap-2">
                <i
                  class="fa-solid fa-layer-group w-4 text-center text-gray-500"
                ></i>
                <span>{{ book.version }}</span>
              </div>
              <div
                class="flex items-center gap-2 mt-2 pt-2 border-t border-dark-600"
              >
                <span
                  v-if="book.platform === 'Bookwalker'"
                  class="text-blue-400 font-bold"
                >
                  <i class="fa-solid fa-mobile-screen"></i> BW電子書
                </span>
                <span
                  v-else-if="book.platform === '實體'"
                  class="text-orange-400 font-bold"
                >
                  <i class="fa-solid fa-book-open"></i> 實體書
                </span>
                <span
                  v-else
                  class="text-gray-600 font-bold text-xs border border-dashed border-gray-600 px-2 py-0.5 rounded"
                >
                  <i class="fa-solid fa-question"></i> 未設定平台
                </span>
              </div>
            </div>

            <div
              class="absolute bottom-4 right-4 flex gap-2 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity"
            >
              <button
                @click="editItem(book)"
                class="p-2 bg-dark-600 hover:bg-teal-600 text-white rounded-lg transition shadow"
              >
                <i class="fa-solid fa-pen"></i>
              </button>
              <button
                @click="deleteItem(book.id)"
                class="p-2 bg-dark-600 hover:bg-red-600 text-white rounded-lg transition shadow"
              >
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <div v-else class="text-center py-20 text-dark-600">
          <i class="fa-solid fa-book-open text-6xl mb-4 opacity-20"></i>
          <p>找不到這本書，或是書櫃是空的...</p>
        </div>
      </div>

      <transition name="modal">
        <div
          v-if="showModal"
          class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center p-4"
        >
          <div
            class="bg-dark-800 rounded-2xl shadow-2xl w-full max-w-lg border border-dark-600"
          >
            <div
              class="px-6 py-4 border-b border-dark-600 flex justify-between items-center"
            >
              <h3 class="text-lg font-bold text-white">
                {{ isEditing ? '編輯書籍' : '登錄新書' }}
              </h3>
              <button
                @click="closeModal"
                class="text-gray-500 hover:text-white"
              >
                <i class="fa-solid fa-times text-xl"></i>
              </button>
            </div>

            <form @submit.prevent="saveItem" class="p-6 space-y-4">
              <div>
                <label
                  class="block text-xs font-bold text-gray-500 uppercase mb-1"
                  >書籍名稱</label
                >
                <input
                  v-model="form.title"
                  required
                  type="text"
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none"
                />
              </div>
              <div>
                <label
                  class="block text-xs font-bold text-gray-500 uppercase mb-1"
                  >作者</label
                >
                <input
                  v-model="form.author"
                  type="text"
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none"
                />
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-xs font-bold text-gray-500 uppercase mb-1"
                    >出版社</label
                  >
                  <select
                    v-model="form.publisher"
                    class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none appearance-none"
                  >
                    <option value="" disabled>請選擇</option>
                    <option>台灣角川</option>
                    <option>東立</option>
                    <option>尖端</option>
                    <option>青文</option>
                    <option>長鴻</option>
                    <option>四季</option>
                    <option>平心</option>
                    <option>威向</option>
                    <option>其他</option>
                  </select>
                </div>
                <div>
                  <label
                    class="block text-xs font-bold text-gray-500 uppercase mb-1"
                    >出版日期</label
                  >
                  <input
                    v-model="form.pubDate"
                    type="date"
                    class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none"
                  />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label
                    class="block text-xs font-bold text-gray-500 uppercase mb-1"
                    >版本/集數</label
                  >
                  <input
                    v-model="form.version"
                    placeholder="例如：第1集、特裝版"
                    type="text"
                    class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-bold text-gray-500 uppercase mb-1"
                    >是否完結</label
                  >
                  <select
                    v-model="form.isFinished"
                    class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white focus:border-teal-500 outline-none"
                  >
                    <option value="N">連載中 (N)</option>
                    <option value="Y">已完結 (Y)</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4 pt-2">
                <div class="bg-dark-900 p-3 rounded-lg border border-dark-600">
                  <label
                    class="block text-xs font-bold text-gray-500 uppercase mb-2"
                    >購買狀況</label
                  >
                  <div class="flex gap-2">
                    <label class="cursor-pointer">
                      <input
                        type="radio"
                        value="已購買"
                        v-model="form.status"
                        class="peer sr-only"
                      />
                      <span
                        class="px-3 py-1 rounded text-xs border border-dark-600 text-gray-400 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:border-teal-600 transition"
                        >已購</span
                      >
                    </label>
                    <label class="cursor-pointer">
                      <input
                        type="radio"
                        value="未購買"
                        v-model="form.status"
                        class="peer sr-only"
                      />
                      <span
                        class="px-3 py-1 rounded text-xs border border-dark-600 text-gray-400 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 transition"
                        >未購</span
                      >
                    </label>
                  </div>
                </div>
                <div class="bg-dark-900 p-3 rounded-lg border border-dark-600">
                  <label
                    class="block text-xs font-bold text-gray-500 uppercase mb-2"
                    >平台</label
                  >
                  <div class="flex gap-2">
                    <label class="cursor-pointer">
                      <input
                        type="radio"
                        value="實體"
                        v-model="form.platform"
                        class="peer sr-only"
                      />
                      <span
                        class="px-3 py-1 rounded text-xs border border-dark-600 text-gray-400 peer-checked:bg-orange-600 peer-checked:text-white transition"
                        >實體</span
                      >
                    </label>
                    <label class="cursor-pointer">
                      <input
                        type="radio"
                        value="Bookwalker"
                        v-model="form.platform"
                        class="peer sr-only"
                      />
                      <span
                        class="px-3 py-1 rounded text-xs border border-dark-600 text-gray-400 peer-checked:bg-blue-600 peer-checked:text-white transition"
                        >BW</span
                      >
                    </label>
                  </div>
                </div>
              </div>

              <div class="pt-4 flex justify-end gap-3">
                <button
                  type="button"
                  @click="closeModal"
                  class="px-4 py-2 text-gray-400 hover:text-white transition"
                >
                  取消
                </button>
                <button
                  type="submit"
                  :disabled="isSaving"
                  class="px-6 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-lg font-bold shadow-lg shadow-teal-900/50 transition flex items-center"
                >
                  <span v-if="isSaving"
                    ><i class="fa-solid fa-spinner fa-spin mr-2"></i>
                    處理中</span
                  >
                  <span v-else>{{ isEditing ? '更新資料' : '確認登錄' }}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </transition>
    </div>

    <script>
      const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

      createApp({
        setup() {
          const API_URL =
            "https://script.google.com/macros/s/AKfycbx48Kfx_s2w30bJgrwZEpcl_cgq3Egr9CAIDkDSElQigxtK08j5cAAXxymvQaJXCClz/exec";

          const items = ref([]);
          const searchQuery = ref("");
          const filterStatus = ref("ALL");
          const isLoading = ref(false);
          const isSaving = ref(false);
          const showModal = ref(false);
          const isEditing = ref(false);
          const bookListRef = ref(null);
          const componentKey = ref(0); // 強制重繪用的金鑰
          let sortableInstance = null;

          const defaultForm = {
            id: "",
            title: "",
            author: "",
            publisher: "台灣角川",
            pubDate: "",
            status: "未購買",
            platform: "實體",
            version: "",
            isFinished: "N",
          };
          const form = ref({ ...defaultForm });

          const isFiltering = computed(() => {
            return searchQuery.value !== "" || filterStatus.value !== "ALL";
          });

          const fetchData = async () => {
            isLoading.value = true;
            try {
              const res = await fetch(API_URL);
              items.value = await res.json();
            } catch (e) {
              alert("讀取失敗");
              console.error(e);
            } finally {
              isLoading.value = false;
            }
          };

          const syncToCloud = async () => {
            isSaving.value = true;
            try {
              await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(items.value),
              });
            } catch (e) {
              alert("儲存失敗！");
            } finally {
              // 延遲關閉，讓使用者清楚看到狀態條
              setTimeout(() => {
                isSaving.value = false;
              }, 1000);
            }
          };

          const filteredItems = computed(() => {
            let result = items.value;
            if (searchQuery.value) {
              const q = searchQuery.value.toLowerCase();
              result = result.filter(
                (i) =>
                  i.title.toLowerCase().includes(q) ||
                  i.author.toLowerCase().includes(q) ||
                  i.publisher.toLowerCase().includes(q)
              );
            }
            if (filterStatus.value !== "ALL") {
              result = result.filter((i) => i.status === filterStatus.value);
            }
            return result;
          });

          // ★★★ 優化後的 Sortable 設定 ★★★
          const initSortable = () => {
            if (bookListRef.value) {
              sortableInstance = new Sortable(bookListRef.value, {
                animation: 200, // 動畫速度
                handle: ".drag-handle", // ★ 關鍵：只允許抓手把
                ghostClass: "sortable-ghost", // 預覽空位樣式
                dragClass: "sortable-drag", // 拖曳中樣式
                forceFallback: true, // ★ 關鍵：強制使用複製品，解決 Grid 亂跳
                fallbackOnBody: true, // 確保複製品在最上層
                disabled: isFiltering.value,

                onEnd: (evt) => {
                  if (isFiltering.value) return;

                  // 1. 移動資料
                  const item = items.value.splice(evt.oldIndex, 1)[0];
                  items.value.splice(evt.newIndex, 0, item);

                  // 2. ★★★ 關鍵修正：強制 Vue 重新渲染列表 ★★★
                  componentKey.value += 1;

                  // 3. 觸發存檔
                  syncToCloud();
                },
              });
            }
          };

          watch(isFiltering, (newVal) => {
            if (sortableInstance) {
              sortableInstance.option("disabled", newVal);
            }
          });

          const openModal = () => {
            isEditing.value = false;
            form.value = { ...defaultForm, id: Date.now() };
            showModal.value = true;
          };

          const editItem = (item) => {
            isEditing.value = true;
            form.value = { ...item };
            showModal.value = true;
          };

          const closeModal = () => (showModal.value = false);

          const saveItem = async () => {
            if (isEditing.value) {
              const idx = items.value.findIndex((i) => i.id === form.value.id);
              if (idx !== -1) items.value[idx] = { ...form.value };
            } else {
              items.value.unshift({ ...form.value });
            }
            closeModal();
            await syncToCloud();
          };

          const deleteItem = async (id) => {
            if (confirm("確定要刪除嗎？")) {
              items.value = items.value.filter((i) => i.id !== id);
              await syncToCloud();
            }
          };

          onMounted(async () => {
            await fetchData();
            nextTick(() => {
              initSortable();
            });
          });

          return {
            items,
            searchQuery,
            filterStatus,
            isLoading,
            isSaving,
            showModal,
            isEditing,
            form,
            filteredItems,
            isFiltering,
            bookListRef,
            openModal,
            closeModal,
            saveItem,
            editItem,
            deleteItem,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
