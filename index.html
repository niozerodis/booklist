<!DOCTYPE html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的藏書閣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              dark: {
                900: "#1a1b1e",
                800: "#25262b",
                700: "#2c2e33",
                600: "#373a40",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #1a1b1e;
        color: #c1c2c5;
        font-family: "Segoe UI", Microsoft JhengHei, sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1b1e;
      }
      ::-webkit-scrollbar-thumb {
        background: #373a40;
        border-radius: 4px;
      }

      /* ★ 拖曳專用樣式 ★ */
      .sortable-ghost {
        opacity: 0.2;
        background: #2c2e33;
        border: 2px dashed #4dabf7;
      }
      .sortable-drag {
        cursor: grabbing;
        opacity: 1 !important;
        background: #25262b;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5),
          0 10px 10px -5px rgba(0, 0, 0, 0.4);
        transform: scale(1.02) rotate(2deg); /* 拿起時稍微轉一點角度 */
      }
      .drag-handle {
        cursor: grab;
      }
      .drag-handle:active {
        cursor: grabbing;
      }

      /* 狀態通知動畫 */
      .toast-enter-active,
      .toast-leave-active {
        transition: all 0.3s ease;
      }
      .toast-enter-from,
      .toast-leave-to {
        opacity: 0;
        transform: translateY(20px);
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen pb-20 relative">
      <transition name="toast">
        <div
          v-if="isLoading || isSaving"
          class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-lg shadow-2xl border border-dark-600 bg-dark-800 text-white"
        >
          <div v-if="isLoading" class="flex items-center text-teal-400">
            <i class="fa-solid fa-circle-notch fa-spin mr-2 text-xl"></i>
            <span class="font-bold">讀取資料中...</span>
          </div>
          <div v-if="isSaving" class="flex items-center text-green-400">
            <i class="fa-solid fa-cloud-arrow-up fa-fade mr-2 text-xl"></i>
            <span class="font-bold">正在儲存順序...</span>
          </div>
        </div>
      </transition>

      <nav
        class="bg-dark-800 border-b border-dark-600 sticky top-0 z-40 shadow-lg"
      >
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-book-bookmark text-teal-400 text-2xl"></i>
              <h1 class="text-xl font-bold text-gray-100">我的藏書閣</h1>
            </div>
            <button
              @click="openModal()"
              class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-md flex items-center"
            >
              <i class="fa-solid fa-plus mr-2"></i> 新增
            </button>
          </div>
        </div>
      </nav>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="flex flex-col md:flex-row gap-4 mb-6">
          <div class="relative flex-grow">
            <i
              class="fa-solid fa-search absolute left-3 top-3 text-gray-500"
            ></i>
            <input
              v-model="searchQuery"
              type="text"
              placeholder="搜尋書名..."
              class="w-full bg-dark-800 border border-dark-600 text-gray-200 pl-10 pr-4 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-teal-500"
            />
          </div>
          <select
            v-model="filterStatus"
            class="bg-dark-800 border border-dark-600 text-gray-200 px-4 py-2 rounded-xl outline-none"
          >
            <option value="ALL">全部狀況</option>
            <option value="已購買">已購買</option>
            <option value="未購買">未購買</option>
          </select>
        </div>

        <div
          v-if="isFiltering"
          class="mb-4 text-center text-sm text-yellow-500 bg-yellow-900/20 py-2 rounded-lg border border-yellow-900/50"
        >
          <i class="fa-solid fa-info-circle"></i>
          搜尋或篩選模式下無法排序，請切換回「全部」來拖曳。
        </div>

        <div
          ref="bookListRef"
          v-if="filteredItems.length > 0"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"
        >
          <div
            v-for="book in filteredItems"
            :key="book.id"
            :data-id="book.id"
            class="bg-dark-800 rounded-xl border border-dark-700 p-5 shadow-lg relative group transition-all"
          >
            <div
              v-if="!isFiltering"
              class="drag-handle absolute top-3 right-3 text-dark-600 hover:text-teal-400 p-2 cursor-grab transition-colors z-20"
              title="按住我拖曳排序"
            >
              <i class="fa-solid fa-grip-vertical text-xl"></i>
            </div>

            <div
              v-if="book.isFinished === 'Y'"
              class="absolute -top-2 -left-2 bg-purple-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow-md z-10 rotate-[-12deg]"
            >
              FIN.
            </div>

            <div class="flex justify-between items-start mb-3 pr-8">
              <h3 class="text-lg font-bold text-white leading-tight">
                {{ book.title }}
              </h3>
            </div>

            <div class="space-y-2 text-sm text-gray-400">
              <div class="flex items-center gap-2">
                <span class="text-gray-300">{{ book.author }}</span>
                <span class="text-xs bg-dark-700 px-2 py-0.5 rounded"
                  >{{ book.publisher }}</span
                >
              </div>

              <div
                class="flex items-center justify-between mt-3 pt-3 border-t border-dark-600"
              >
                <div class="text-xs">
                  <span
                    v-if="book.platform === 'Bookwalker'"
                    class="text-blue-400 font-bold"
                    ><i class="fa-solid fa-mobile-screen"></i> BW</span
                  >
                  <span
                    v-else-if="book.platform === '實體'"
                    class="text-orange-400 font-bold"
                    ><i class="fa-solid fa-book-open"></i> 實體</span
                  >
                  <span
                    v-else
                    class="text-gray-600 border border-dashed border-gray-600 px-1 rounded"
                    >未設定</span
                  >
                </div>

                <span
                  :class="book.status === '已購買' ? 'text-teal-400' : 'text-red-400'"
                  class="font-bold text-xs"
                >
                  {{ book.status }}
                </span>
              </div>
            </div>

            <div
              class="absolute bottom-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity"
            >
              <button
                @click="editItem(book)"
                class="text-gray-400 hover:text-white px-2"
              >
                <i class="fa-solid fa-pen"></i>
              </button>
              <button
                @click="deleteItem(book.id)"
                class="text-gray-400 hover:text-red-400 px-2"
              >
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <div v-else-if="!isLoading" class="text-center py-20 text-dark-600">
          <i class="fa-solid fa-book-open text-6xl mb-4 opacity-20"></i>
          <p>沒有找到書籍</p>
        </div>
      </div>

      <transition name="modal">
        <div
          v-if="showModal"
          class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center p-4"
        >
          <div
            class="bg-dark-800 rounded-2xl shadow-2xl w-full max-w-lg border border-dark-600 p-6"
          >
            <h3 class="text-lg font-bold text-white mb-4">
              {{ isEditing ? '編輯書籍' : '登錄新書' }}
            </h3>
            <form @submit.prevent="saveItem" class="space-y-4">
              <input
                v-model="form.title"
                required
                placeholder="書名"
                type="text"
                class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white outline-none focus:border-teal-500"
              />
              <input
                v-model="form.author"
                placeholder="作者"
                type="text"
                class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white outline-none focus:border-teal-500"
              />
              <div class="grid grid-cols-2 gap-4">
                <select
                  v-model="form.publisher"
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white outline-none"
                >
                  <option>台灣角川</option>
                  <option>東立</option>
                  <option>尖端</option>
                  <option>青文</option>
                  <option>長鴻</option>
                  <option>平心</option>
                  <option>其他</option>
                </select>
                <input
                  v-model="form.pubDate"
                  type="date"
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white outline-none"
                />
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div
                  class="bg-dark-900 p-2 rounded border border-dark-600 flex justify-center gap-2"
                >
                  <label
                    ><input
                      type="radio"
                      value="已購買"
                      v-model="form.status"
                      class="mr-1"
                    />已購</label
                  >
                  <label
                    ><input
                      type="radio"
                      value="未購買"
                      v-model="form.status"
                      class="mr-1"
                    />未購</label
                  >
                </div>
                <div
                  class="bg-dark-900 p-2 rounded border border-dark-600 flex justify-center gap-2"
                >
                  <label
                    ><input
                      type="radio"
                      value="實體"
                      v-model="form.platform"
                      class="mr-1"
                    />實體</label
                  >
                  <label
                    ><input
                      type="radio"
                      value="Bookwalker"
                      v-model="form.platform"
                      class="mr-1"
                    />BW</label
                  >
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <input
                  v-model="form.version"
                  placeholder="集數/版本"
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white outline-none"
                />
                <select
                  v-model="form.isFinished"
                  class="w-full bg-dark-900 border border-dark-600 rounded-lg p-2.5 text-white outline-none"
                >
                  <option value="N">連載中</option>
                  <option value="Y">已完結</option>
                </select>
              </div>
              <div class="flex justify-end gap-3 mt-4">
                <button
                  type="button"
                  @click="closeModal"
                  class="px-4 py-2 text-gray-400"
                >
                  取消
                </button>
                <button
                  type="submit"
                  class="px-6 py-2 bg-teal-600 text-white rounded-lg font-bold"
                >
                  確認
                </button>
              </div>
            </form>
          </div>
        </div>
      </transition>
    </div>

    <script>
      const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

      createApp({
        setup() {
          // ★ 請記得換回你的網址 ★
          const API_URL = "https://script.google.com/macros/s/AKfycbx48Kfx_s2w30bJgrwZEpcl_cgq3Egr9CAIDkDSElQigxtK08j5cAAXxymvQaJXCClz/exec";

          const items = ref([]);
          const searchQuery = ref("");
          const filterStatus = ref("ALL");
          const isLoading = ref(false);
          const isSaving = ref(false);
          const showModal = ref(false);
          const isEditing = ref(false);
          const bookListRef = ref(null);
          let sortableInstance = null;

          const defaultForm = {
            id: "",
            title: "",
            author: "",
            publisher: "台灣角川",
            pubDate: "",
            status: "未購買",
            platform: "實體",
            version: "",
            isFinished: "N",
          };
          const form = ref({ ...defaultForm });

          const isFiltering = computed(
            () => searchQuery.value !== "" || filterStatus.value !== "ALL"
          );

          const fetchData = async () => {
            isLoading.value = true;
            try {
              const res = await fetch(API_URL);
              items.value = await res.json();
            } catch (e) {
              console.error(e);
            } finally {
              isLoading.value = false;
            }
          };

          const syncToCloud = async () => {
            isSaving.value = true; // ★ 這會觸發右下角的通知
            try {
              await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(items.value),
              });
            } catch (e) {
              alert("儲存失敗");
            } finally {
              // 延遲一點點關閉，讓你看到「儲存中」的文字
              setTimeout(() => {
                isSaving.value = false;
              }, 1000);
            }
          };

          const filteredItems = computed(() => {
            let result = items.value;
            if (searchQuery.value) {
              const q = searchQuery.value.toLowerCase();
              result = result.filter(
                (i) =>
                  i.title.toLowerCase().includes(q) ||
                  i.author.toLowerCase().includes(q)
              );
            }
            if (filterStatus.value !== "ALL")
              result = result.filter((i) => i.status === filterStatus.value);
            return result;
          });

          // ★ 修正後的拖曳設定 ★
          const initSortable = () => {
            if (bookListRef.value) {
              sortableInstance = new Sortable(bookListRef.value, {
                animation: 200, // 動畫速度
                handle: ".drag-handle", // ★ 只允許抓這個 class 拖曳
                ghostClass: "sortable-ghost", // 預覽空位的樣式
                dragClass: "sortable-drag", // 正在拖的那張卡的樣式
                forceFallback: true, // ★ 關鍵：強制使用複製體拖曳，解決 Grid 亂跳問題
                fallbackOnBody: true, // 確保拖曳層級最高
                disabled: isFiltering.value,

                onEnd: (evt) => {
                  if (isFiltering.value) return;
                  const item = items.value.splice(evt.oldIndex, 1)[0];
                  items.value.splice(evt.newIndex, 0, item);
                  syncToCloud();
                },
              });
            }
          };

          watch(isFiltering, (newVal) => {
            if (sortableInstance) sortableInstance.option("disabled", newVal);
          });

          const openModal = () => {
            isEditing.value = false;
            form.value = { ...defaultForm, id: Date.now() };
            showModal.value = true;
          };
          const editItem = (item) => {
            isEditing.value = true;
            form.value = { ...item };
            showModal.value = true;
          };
          const closeModal = () => (showModal.value = false);

          const saveItem = async () => {
            if (isEditing.value) {
              const idx = items.value.findIndex((i) => i.id === form.value.id);
              if (idx !== -1) items.value[idx] = { ...form.value };
            } else {
              items.value.unshift({ ...form.value });
            }
            closeModal();
            await syncToCloud();
          };

          const deleteItem = async (id) => {
            if (confirm("刪除？")) {
              items.value = items.value.filter((i) => i.id !== id);
              await syncToCloud();
            }
          };

          onMounted(async () => {
            await fetchData();
            nextTick(() => {
              initSortable();
            });
          });

          return {
            items,
            searchQuery,
            filterStatus,
            isLoading,
            isSaving,
            showModal,
            isEditing,
            form,
            filteredItems,
            isFiltering,
            bookListRef,
            openModal,
            closeModal,
            saveItem,
            editItem,
            deleteItem,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
